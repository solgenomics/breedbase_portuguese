method: GET
action: "/stock/search"
params_ignore_underscore: true
attributes:
    name: stock_search_form
    id: stock_search_form
javascript:
    function toggle_advanced() {
            jQuery('div[class*="advanced"]').toggle();
    }
    jQuery(function(){
        jQuery("#advanced_toggle").click(function(){
            toggle_advanced();
        });
        if( jQuery("input#advanced_toggle").attr('checked') ) {
            toggle_advanced();
        }
        jQuery("#trait").blur(function(){
            jQuery("#trait_range").replaceWith(
                'Intervalo da característica'
            );
        });
    });
elements:

    - type: Text
      name: stock_name
      id:   stock_name
      label: Nome do material
      size: 30

    - type: Select
      name: stock_type
      label: Tipo de material

    - type: Select
      name: organism
      label: Organismo

    - type: Hidden
      name: search_submitted
      value: 1

    # hidden form values for page and page size
    - type: Hidden
      name: page
      value: 1

    - type: Hidden
      name: page_size
      default: 20

    - type: Text
      name: description
      id: description
      label: Descrição

    - type: Text
      name: person
      id: person
      label: Editor

    - type: Text
      name: onto
      id: onto
      label: Termo de ontologia
      size: 50

    - type: Text
      name: trait
      id: trait
      label: Característica
      size: 50

    - type: Text
      name: min_limit
      id: min_limit
      label: Valor mínimo
      size: 5

    - type: Text
      name: max_limit
      id: max_limit
      label: Valor máximo
      size: 5

    - type: Text
      name: project
      id: project
      label: Projeto
      size: 50

    - type: Text
      name: location
      id: location
      label: Local do projeto
      size: 40

    - type: Text
      name: year
      id: year
      label: Ano do projeto
      size: 15

    - type: Submit
      name: submit
      value: Pesquisar
