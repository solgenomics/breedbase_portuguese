                         title: "Este parâmetro é EXPERIMENTAL. Confira a saída com atenção; entradas incorretas podem causar erros no Primer3. Define o índice da primeira base de um códon de início e permite selecionar pares de primers para criar amplicons na mesma fase de leitura, por exemplo, moldes para proteínas de fusão. O Primer3 tenta selecionar um primer esquerdo na mesma fase, de preferência iniciando no códon de início ou à esquerda dele; se necessário, à direita. Valores negativos são válidos quando o códon de início está à esquerda da sequência disponível. Se o valor for não negativo, o Primer3 informa um erro se o códon na posição indicada não for ATG. Um valor menor ou igual a -10^6 faz o Primer3 ignorar este parâmetro. A posição do primer direito é escolhida buscando um códon de parada à direita do primer esquerdo. Idealmente, o primer direito termina no códon de parada ou depois dele."
