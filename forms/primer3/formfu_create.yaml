---
# indicator is the field that is used to test for form submission
indicator: submit
# Start listing the form elements
action: primer3/update
elements:

    - type: Block
      tag: p
      elements:
        - type: Block
          tag: table
          elements:
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td
                  elements:
                    - type: Select
                      label: "Cole a sequência de origem abaixo (5'->3', sequência de ACGTNacgtn; outras letras são tratadas como N; números e espaços são ignorados). O formato FASTA é aceito. Substitua as regiões indesejadas (vetores, ALUs, LINEs etc.) por N ou use uma biblioteca de anelamento inespecífico (biblioteca de repetições):"
                      name: PRIMER_MISPRIMING_LIBRARY
                      attributes:
                          title: "Esta opção indica qual biblioteca de anelamento inespecífico, se houver, o Primer3 deve usar para identificar repetições dispersas ou outras sequências a evitar como locais de ligação dos primers. As bibliotecas humana e de roedores da página foram adaptadas de Repbase (J. Jurka, A.F.A. Smit, C. Pethiyagoda, et al., 1995-1996), ftp://ftp.ncbi.nih.gov/repository/repbase). A biblioteca humana é a concatenação de humrep.ref e simple.ref, convertida para FASTA. Há duas bibliotecas de roedores: uma é rodrep.ref convertida para FASTA e a outra é a concatenação de rodrep.ref e simple.ref, convertida para FASTA.\n\nA biblioteca de Drosophila é a concatenação de duas bibliotecas do Berkeley Drosophila Genome Project:\n\n1. Uma biblioteca de elementos transponíveis: The transposable elements of the Drosophila melanogaster euchromatin - a genomics perspective. J.S. Kaminker, C.M. Bergman, B. Kronmiller, J. Carlson, R. Svirskas, S. Patel, E. Frise, D.A. Wheeler, S.E. Lewis, G.M. Rubin, M. Ashburner e S.E. Celniker. Genome Biology (2002) 3(12):research0084.1-0084.20, http://www.fruitfly.org/p_disrupt/datasets/ASHBURNER/D_mel_transposon_sequence_set.fasta\n\n2. Uma biblioteca de sequências repetitivas de DNA: http://www.fruitfly.org/sequence/sequence_db/na_re.dros."

                      options: 
                        - [ '', 'Nenhuma' ]
                        - [ 'static/documents/primer3-libraries/human.txt', 'Humana' ]
                        - [ 'static/documents/primer3-libraries/rodent_and_simple.txt', 'Roedores e repetições simples' ]
                        - [ 'static/documents/primer3-libraries/rodent.txt', 'Roedores' ]
                        - [ 'static/documents/primer3-libraries/drosophila.txt', 'DROSOPHILA' ]

            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td
                  elements:
                    - type: Textarea
                      name: SEQUENCE_TEMPLATE
                      cols: 100
                      rows: 10





##### Pick left primer, internal oligo, right primer #####

    - type: Block
      tag: p
      elements:
        - type: Block
          tag: table border="1"
          elements:
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td
                  elements:
                    - type: Checkbox
                      name: PRIMER_PICK_LEFT_PRIMER
                      label: "Selecionar primer esquerdo ou usar o primer esquerdo abaixo:"
                      default: 1
                - type: Block
                  tag: td
                  elements: 
                    - type: Checkbox
                      name: PRIMER_PICK_INTERNAL_OLIGO
                      label: "Selecionar sonda de hibridização (oligo interno) ou usar o oligo abaixo:"
                      default: 0
                - type: Block
                  tag: td
                  elements:
                    - type: Checkbox
                      name: PRIMER_PICK_RIGHT_PRIMER
                      label: "Selecionar primer direito ou usar o primer direito abaixo (5' a 3' na fita oposta):"
                      default: 1
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: SEQUENCE_PRIMER
                      attributes:
                          size: 30                    
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: SEQUENCE_INTERNAL_OLIGO
                      attributes:
                          size: 30   
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: SEQUENCE_PRIMER_REVCOMP
                      attributes:
                          size: 30   


###### Sequence ID, Targets, Excluded Regions Table ######

    - type: Block
      tag: p
      elements:
        - type: Block
          tag: table
          elements:  
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "ID da sequência:"
                      attributes:
                          title: "Identificador reproduzido na saída para permitir a identificação dos primers selecionados."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: SEQUENCE_ID
                - type: Block
                  tag: td
                  elements:
                    - type: Block
                      content: "Texto para identificar o resultado."
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Alvos:"
                      attributes:
                          title: "Se um ou mais alvos forem especificados, um par de primers válido deverá flanquear pelo menos um deles. Um alvo pode ser uma repetição de sequência simples (por exemplo, uma repetição CA) ou um polimorfismo de um único par de bases. Informe uma lista de pares start,length separados por espaços, em que start é o índice da primeira base do alvo e length é seu comprimento."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: SEQUENCE_TARGET 
                - type: Block
                  tag: td
                  elements:
                    - type: Block
                      content: "Ex.: 50,2 exige que os primers flanqueiem as 2 bases nas posições 50 e 51."
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Regiões excluídas:"
                      attributes:
                          title: "Os primers não podem se sobrepor a nenhuma região especificada neste campo. Informe uma lista de pares start,length separados por espaços, em que start é o índice da primeira base da região excluída e length é seu comprimento. Este campo permite excluir regiões de baixa qualidade de sequência ou que contenham elementos repetitivos, como ALUs ou LINEs."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: SEQUENCE_EXCLUDED_REGION 
                - type: Block
                  tag: td
                  elements:
                    - type: Block
                      content: "Ex.: 401,7 68,3 impede a seleção de primers nas 7 bases a partir de 401 e nas 3 bases a partir de 68."

    - type: Block
      tag: p
      elements:
        - type: Block
          tag: table
          elements:
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Faixas de tamanho do produto:"
                      attributes:
                          title: "Lista de faixas de tamanho do produto, por exemplo: 150-250 100-300 301-400. O Primer3 tenta primeiro selecionar primers na primeira faixa. Se não for possível, tenta a próxima faixa, até selecionar todos os primers necessários ou esgotar as faixas. Por razões técnicas, esta opção exige muito menos processamento que a opção Tamanho do produto."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: PRIMER_PRODUCT_SIZE_RANGE
                      default: 100-300
                      attributes:
                        size: 70



##### Number to Return, Max 3' Stability, ... #####

    - type: Block
      tag: p
      elements:
        - type: Block
          tag: table
          elements:
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Número de pares a retornar (máx. 10):"
                      attributes:
                          title: "Número máximo de pares de primers a retornar. Os pares são ordenados pela qualidade, isto é, pelo valor da função objetivo (um valor menor indica um par melhor). Atenção: valores altos aumentam o tempo de execução."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: PRIMER_NUM_RETURN
                      default: 5
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Estabilidade máxima em 3':"
                      attributes:
                          title: "Estabilidade máxima das últimas cinco bases 3' do primer esquerdo ou direito. Números maiores indicam extremidades 3' mais estáveis. O valor é o delta G máximo (kcal/mol) para a dissociação do duplex dessas cinco bases, calculado com os parâmetros de vizinhos mais próximos especificados em Tabela de parâmetros termodinâmicos. Com a tabela de SantaLucia 1998, DOI:10.1073/pnas.95.4.1460, os valores de deltaG dos duplexes de 5 bases mais estável e menos estável são, respectivamente, 6.86 kcal/mol (GCGCG) e 0.86 kcal/mol (TATAT). Com a tabela de Breslauer et al. 1986, 10.1073/pnas.83.11.3746, os valores correspondentes são 13.4 kcal/mol (GCGCG) e 4.6 kcal/mol (TATAC)."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_MAX_END_STABILITY
                      default: 9.0
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Anelamento inespecífico máximo em repetições:"
                      attributes:
                          title: "Similaridade ponderada máxima permitida com qualquer sequência da biblioteca de anelamento inespecífico. O padrão é 12."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: PRIMER_MAX_LIBRARY_MISPRIMING
                      default: 12.00
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Anelamento inespecífico máximo do par em repetições:"
                      attributes:
                          title: "Soma máxima permitida das similaridades de um par de primers (uma para cada primer) com uma única sequência da biblioteca de anelamento inespecífico. Os pesos das sequências da biblioteca não são usados nessa soma."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_PAIR_MAX_LIBRARY_MISPRIMING
                      default: 24.00
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Anelamento inespecífico máximo no molde:"
                      attributes:
                          title: "Similaridade máxima permitida com sítios ectópicos na sequência usada para desenhar os primers. A pontuação é a mesma do anelamento inespecífico máximo, mas códigos de ambiguidade nunca são tratados como consenso."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: PRIMER_MAX_TEMPLATE_MISPRIMING
                      default: 12.00
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Anelamento inespecífico máximo do par no molde:"
                      attributes:
                          title: "Soma máxima permitida das similaridades dos dois primers com sítios ectópicos na sequência usada para desenhá-los. A pontuação é a mesma do anelamento inespecífico máximo, mas códigos de ambiguidade nunca são tratados como consenso."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_PAIR_MAX_TEMPLATE_MISPRIMING
                      default: 24.00

    - type: Submit
      name: submit
      value: Selecionar primers

    - type: Block
      tag: h2
      elements:
        - type: Block
          content: "Condições gerais de seleção de primers"

    - type: Block
      tag: p
      elements:
        - type: Block
          tag: table
          elements:
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Tamanho do primer"
                      attributes:
                          title: "Comprimentos mínimo, ótimo e máximo (em bases) de um primer. O Primer3 não seleciona primers menores que o mínimo ou maiores que o máximo e, com os parâmetros padrão, busca tamanhos próximos do ótimo. O mínimo não pode ser menor que 1 nem maior que o máximo. O máximo não pode ser maior que 36, limite de tamanho do oligo para o qual os cálculos de temperatura de dissociação são válidos."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: PRIMER_MIN_SIZE
                      label: "Mín."
                      default: 18
                      attributes:
                          size: 10
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_OPT_SIZE
                      label: "Ótimo"
                      default: 20
                      attributes:
                          size: 10
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_MAX_SIZE
                      label: "Máx."
                      default: 27
                      attributes:
                          size: 10
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Tm do primer"
                      attributes:
                          title: "Temperaturas de dissociação mínima, ótima e máxima (Celsius) de um primer. O Primer3 não seleciona oligos com temperaturas menores que a mínima ou maiores que a máxima e, nas condições padrão, busca temperaturas próximas da ótima.\n\nPor padrão, o Primer3 usa a fórmula de temperatura de dissociação e a tabela de parâmetros termodinâmicos de Breslauer et al. 1986, DOI:10.1073/pnas.83.11.3746. Para mais informações, consulte Tabela de parâmetros termodinâmicos."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: PRIMER_MIN_TM
                      label: "Mín."
                      default: 57.0
                      attributes:
                          size: 10
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_OPT_TM
                      label: "Ótimo"
                      default: 60.0
                      attributes:
                          size: 10
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_MAX_TM
                      label: "Máx."
                      default: 63.0
                      attributes:
                          size: 10
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Diferença máxima de Tm"
                      attributes:
                          title: "Diferença máxima aceitável (em valor absoluto) entre as temperaturas de dissociação dos primers esquerdo e direito."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_PAIR_MAX_DIFF_TM
                      default: 100.0
                      attributes:
                          size: 10
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Tm do produto"
                      attributes:
                          title: "Temperaturas de dissociação mínima, ótima e máxima do amplicon. O Primer3 não seleciona produtos com temperatura abaixo da mínima ou acima da máxima. Se a ótima for informada e os pesos de penalidade para tamanho do produto forem diferentes de 0, busca amplicons com temperatura próxima da ótima.\n\nO Primer3 calcula a Tm do produto com a fórmula de Bolton e McCarthy, PNAS 84:1390 (1962), apresentada em Sambrook, Fritsch e Maniatis, Molecular Cloning, p. 11.46 (1989, CSHL Press):\n\nTm = 81.5 + 16.6(log10([Na+])) + .41*(%GC) - 600/length,\n\nem que [Na+] é a concentração molar de sódio, (%GC) é a porcentagem de Gs e Cs e length é o comprimento da sequência.\n\nO programa de seleção de primers prime, do GCG (http://www.accelrys.com/products/gcg/), usa uma fórmula semelhante, com 675.0 / length no último termo, conforme F. Baldino, Jr, M.-F. Chesselet e M.E. Lewis, Methods in Enzymology 168:766 (1989), equação (1), p. 766, sem os termos de incompatibilidade e formamida. Essas fórmulas pressupõem Na+ em vez de K+. Segundo J.G. Wetmur, Critical Reviews in BioChem. and Mol. Bio. 26:227 (1991), 50 mM K+ equivalem a .2 M Na+ nessas fórmulas. O Primer3 usa a mesma concentração de sal para calcular a temperatura de dissociação do primer e do oligo. Se o produto de PCR for usado posteriormente para hibridização, esse cálculo não fornecerá a Tm nas condições de hibridização."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: PRIMER_PRODUCT_MIN_TM
                      label: "Mín."
                      attributes:
                          size: 10 
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_PRODUCT_OPT_TM
                      label: "Ótimo"
                      attributes:
                          size: 10
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_PRODUCT_MAX_TM
                      label: "Máx."
                      attributes:
                          size: 10
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Tabela de parâmetros termodinâmicos"
                      attributes:
                          title: "Escolha da tabela de parâmetros termodinâmicos de vizinhos mais próximos e do método de cálculo da temperatura de dissociação. Há duas tabelas disponíveis:\n\nBreslauer et al. 1986, DOI:10.1073/pnas.83.11.3746: usa a fórmula de Rychlik et al. 1990 (utilizada até a versão 1.0.1 do Primer3). É o padrão por compatibilidade com versões anteriores.\nSantaLucia 1998, DOI:10.1073/pnas.95.4.1460: opção recomendada.\n\nPara escolher o método de correção salina, consulte Fórmula de correção salina."
                - type: Block
                  tag: td
                  elements:
                    - type: Select
                      name: PRIMER_TM_FORMULA
                      options:
                        - ['0', 'Breslauer et al. 1986' ]
                        - ['1', 'SantaLucia' ]
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "GC% do primer"
                      attributes:
                          title: "Porcentagens mínima, ótima e máxima de Gs e Cs em qualquer primer ou oligo."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: PRIMER_MIN_GC
                      label: "Mín."
                      default: 20.0
                      attributes:
                          size: 10
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_OPT_GC_PERCENT
                      label: "Ótimo"
                      attributes:
                          size: 10
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_MAX_GC
                      label: "Máx."
                      default: 80.0
                      attributes:
                          size: 10

##### Max Self Complementarity, Max #Ns's, ... #####

    - type: Block
      tag: p
      elements:
        - type: Block
          tag: table
          elements:
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Autocomplementaridade máxima:"
                      attributes:
                          title: "Pontuação máxima permitida de alinhamento local ao testar a autocomplementaridade de um primer ou a complementaridade entre os primers esquerdo e direito. A autocomplementaridade local indica a tendência de os primers se anelarem entre si sem necessariamente causar autoamplificação na PCR. A pontuação é 1.00 para bases complementares, -0.25 para o alinhamento de qualquer base (ou N) com N, -1.00 para bases incompatíveis e -2.00 para uma lacuna. Só são permitidas lacunas de um único par de bases. As pontuações são não negativas; 0.00 indica ausência de um alinhamento local adequado entre dois oligos."
                - type: Block
                  tag: td
                  elements: 
                    - type: Text
                      name: PRIMER_MAX_SELF_ANY
                      default: 8.00
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Autocomplementaridade máxima em 3'"
                      attributes:
                          title: "Pontuação máxima permitida de alinhamento global ancorado em 3' ao testar a autocomplementaridade de um primer ou a complementaridade entre os primers esquerdo e direito. Essa pontuação indica a probabilidade de dímeros de primers iniciarem amplificação na PCR."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_MAX_SELF_END
                      default: 3.00
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Número máximo de Ns:"
                      attributes:
                          title: "Número máximo de bases desconhecidas (N) permitido em qualquer primer."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_MAX_NS_ACCEPTED
                      default: 0
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Comprimento máximo de poli-X:"
                      attributes:
                          title: "Comprimento máximo permitido de uma repetição mononucleotídica, por exemplo AAAAAA."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_MAX_POLY_X
                      default: 5
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Penalidade dentro do alvo:"
                      attributes:
                          title: "Valores diferentes do padrão só são válidos para sequências com 0 ou 1 região-alvo. Se um primer pertencer a um par que flanqueia um alvo e se sobrepuser a ele, multiplique este valor pelo número de posições sobrepostas ao alvo único para obter a penalidade de posição. Isso permite incluir a sobreposição ao alvo como termo da função objetivo."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_INSIDE_PENALTY
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Penalidade fora do alvo:"
                      attributes:
                          title: "Valores diferentes do padrão só são válidos para sequências com 0 ou 1 região-alvo. Se um primer pertencer a um par que flanqueia um alvo e não se sobrepuser a ele, multiplique este valor pela distância em posições entre a extremidade 3' e o alvo único para obter a penalidade de posição. Isso permite incluir a proximidade do alvo como termo da função objetivo."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_OUTSIDE_PENALTY
                      default: 0
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Índice da primeira base:"
                      attributes:
                          title: "Índice da primeira base da sequência de entrada. Use 1 para entradas e saídas com indexação iniciada em 1, como no GenBank, ou 0 para indexação iniciada em 0. Este parâmetro também afeta os índices dos arquivos gerados quando a opção de arquivo de primers está ativada. O padrão da interface web é 1."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_FIRST_BASE_INDEX
                      default: 1
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Bases GC na extremidade 3':"
                      attributes:
                          title: "Exige o número especificado de Gs e Cs consecutivos na extremidade 3' dos primers esquerdo e direito. Não afeta o oligo de hibridização, caso solicitado."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_GC_CLAMP
                      default: 0
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Concentração de cátions monovalentes:"
                      attributes:
                          title: "Concentração milimolar de sal (geralmente KCl) na PCR. O Primer3 usa este parâmetro para calcular as temperaturas de dissociação dos oligos."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_SALT_MONOVALENT
                      default: 50.0
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Fórmula de correção salina:"
                      attributes:
                          title: "Fórmula de correção salina para o cálculo da temperatura de dissociação. Há três opções: (1) Schildkraut e Lifson 1965, DOI:10.1002/bip.360030207, usada até a versão 1.0.1 do Primer3 e padrão da versão 1.1.0 por compatibilidade; (2) SantaLucia 1998, DOI:10.1073/pnas.95.4.1460, opção recomendada; (3) Owczarzy et al. 2004, DOI:10.1021/bi034621r."
                - type: Block
                  tag: td
                  elements:
                    - type: Select
                      name: PRIMER_SALT_CORRECTIONS
                      options:
                        - ['0', 'Schildkraut and Lifson 1965' ]
                        - ['1', 'SantaLucia 1998' ]
                        - ['2', 'Owczarzy et. 2004' ]
            - type: Block
              tag: tr
              elements:
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Concentração de cátions divalentes:"
                      attributes:
                          title: "Concentração milimolar de cátions de sais divalentes (geralmente MgCl2+ na PCR). O Primer3 converte essa concentração em concentração de cátions monovalentes usando a fórmula de Ahsen et al., 2001.\n\nNessa fórmula, a concentração de desoxirribonucleotídeos trifosfato [dNTP] deve ser menor que a de cátions divalentes, pois parte do magnésio se liga aos dNTPs. A concentração de cátions monovalentes obtida é usada para calcular a temperatura de dissociação dos oligos/primers. Informe a concentração de dNTPs no campo correspondente."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_SALT_DIVALENT
                      default: 0
                - type: Block
                  tag: td style="color:blue;"
                  elements:
                    - type: Block
                      content: "Concentração de dNTPs:"
                      attributes:
                          title: "Concentração milimolar de desoxirribonucleotídeos trifosfato. Só é considerada quando a concentração de cátions divalentes é informada."
                - type: Block
                  tag: td
                  elements:
                    - type: Text
                      name: PRIMER_DNTP_CONC
                      default: 0.0

    - type: Block
      tag: table
      elements:    
        - type: Block
          tag: tr
          elements:
            - type: Block
              tag: td style="color:blue;"
              elements:
                - type: Block
                  content: "Concentração de oligos anelados:"
                  attributes: 
                      title: "Concentração nanomolar de oligos anelados na PCR, usada pelo Primer3 para calcular as temperaturas de dissociação. O padrão (50nM) funciona bem com o protocolo do Whitehead/MIT Center for Genome Research: 0.5 microlitros de cada primer a 20 micromolar em uma reação de 20 microlitros com 10 nanogramas de molde, 0.025 unidades/microlitro de Taq polimerase, 0.1 mM de cada dNTP, 1.5mM MgCl2, 50mM KCl e 10mM Tris-HCL (pH 9.3), em 35 ciclos com temperatura de anelamento de 56 graus Celsius. Este parâmetro corresponde a 'c' na equação (ii) de Rychlik, Spencer e Rhoads (Nucleic Acids Research, vol. 18, núm. 21), cujo valor adequado para menor concentração inicial de molde é determinado empiricamente. O valor é menor que a concentração real de oligos na reação, pois representa apenas os oligos anelados e depende da quantidade de molde, incluindo o produto de PCR, em cada ciclo. Essa concentração aumenta muito durante a PCR; a reação, porém, costuma tolerar uma ampla faixa de temperaturas de dissociação dos oligos."
